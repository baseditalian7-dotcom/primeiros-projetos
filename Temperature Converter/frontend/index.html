<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="page">
        <section class="converter-shell">
            <aside class="result-stage" aria-live="polite">
                <div class="stage-top">
                    <p>Temperature Converter</p>
                    <span id="formulaText">°F = (°C × 9/5) + 32</span>
                </div>
                <strong id="resultValue">--</strong>
                <p id="resultMessage">Digite uma temperatura para converter.</p>
            </aside>

            <section class="control-panel">
                <div class="header">
                    <p>Projeto 5</p>
                    <h1>Conversor de temperatura</h1>
                    <span>Agora com visual diferente, histórico e conversão instantânea.</span>
                </div>

                <div class="tabs" role="group" aria-label="Tipo de conversão">
                    <button class="tab active" type="button" data-conversion="celsiusToFahrenheit">°C para °F</button>
                    <button class="tab" type="button" data-conversion="fahrenheitToCelsius">°F para °C</button>
                </div>

                <form id="converterForm" class="converter-form">
                    <label for="temperatureInput">Temperatura</label>
                    <div class="input-wrap">
                        <input id="temperatureInput" type="number" step="any" placeholder="25" required>
                        <span id="inputUnit">°C</span>
                    </div>
                </form>

                <button id="swapButton" class="swap-button" type="button">Inverter conversão</button>

                <section class="history-section">
                    <div class="history-header">
                        <h2>Últimas conversões</h2>
                        <button id="clearHistoryButton" type="button">Limpar</button>
                    </div>
                    <ul id="historyList" class="history-list"></ul>
                    <p id="emptyHistory" class="empty-history">Nenhuma conversão feita ainda.</p>
                </section>
            </section>
        </section>
    </main>
</body>
</html>
