<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="quiz-page">
        <section class="show-shell">
            <div class="show-top">
                <span>Projeto 11</span>
                <strong>Interactive Quiz</strong>
                <span id="progressText">Pergunta 1 de 5</span>
            </div>

            <section id="quizContent" class="show-stage">
                <div class="category-pill" id="categoryText">Fundamentos</div>
                <h1 id="questionText">Carregando pergunta...</h1>
                <div id="answersList" class="answers-list"></div>
                <p id="feedbackText" class="feedback-text"></p>
                <button id="nextButton" class="next-button" type="button" disabled>Próxima pergunta</button>
            </section>

            <section id="finalPanel" class="final-panel" hidden>
                <span>Resultado final</span>
                <strong id="finalScore">0/5</strong>
                <p id="finalMessage">Você concluiu o quiz.</p>
                <button id="restartButton" type="button">Reiniciar quiz</button>
            </section>

            <footer class="show-footer">
                <div id="progressDots" class="progress-dots"></div>
                <div class="score-badge">
                    <span>Pontos</span>
                    <strong id="scoreText">0</strong>
                </div>
            </footer>
        </section>
    </main>
</body>
</html>
